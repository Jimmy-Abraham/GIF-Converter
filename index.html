<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X GIF to WhatsApp sticker</title>
<style>
  :root { --bg:#f3f6f4; --ink:#14231b; --muted:#5b6b62; --brand:#1faa59; --brand-ink:#fff; --line:#d5ddd8; --err:#b3261e; --card:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1713; --ink:#e8f0eb; --muted:#93a39a; --brand:#2bc26b; --brand-ink:#08130d; --line:#26352d; --err:#ff8a80; --card:#16211b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; min-height:100vh; display:grid; place-items:start center; padding:24px 16px; }
  main { width:100%; max-width:440px; }
  h1 { font-size:1.6rem; line-height:1.15; margin:24px 0 6px; }
  p.sub { margin:0 0 20px; color:var(--muted); }
  .row { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); font:inherit; }
  button { padding:12px 16px; border:0; border-radius:10px; font:inherit; font-weight:600; cursor:pointer; background:var(--brand); color:var(--brand-ink); }
  button.alt { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  :focus-visible { outline:3px solid var(--brand); outline-offset:2px; }
  #result { margin-top:20px; display:none; }
  .stage { background:repeating-conic-gradient(var(--line) 0 25%, var(--card) 0 50%) 0 0/20px 20px; border-radius:12px; padding:12px; }
  img { width:100%; max-width:256px; aspect-ratio:1; display:block; margin:0 auto; }
  .actions { display:grid; gap:8px; margin-top:12px; }
  .hint { color:var(--muted); font-size:.9rem; margin:12px 0 0; }
  #msg { margin-top:12px; color:var(--muted); min-height:1.5em; }
  #msg.err { color:var(--err); }
</style>
</head>
<body>
<main>
  <h1>Turn an X GIF into a WhatsApp sticker</h1>
  <p class="sub">Paste the link to a post with a GIF. You'll get an animated sticker file.</p>

  <div class="row">
    <input id="link" type="url" inputmode="url" placeholder="https://x.com/user/status/123…" aria-label="X post link">
    <button id="go">Make sticker</button>
  </div>

  <div id="result">
    <div class="stage"><img id="pic" alt="Sticker preview"></div>
    <div class="actions">
      <button id="share">Send to WhatsApp</button>
      <button id="dl" class="alt">Download .webp</button>
    </div>
    <p class="hint" id="size"></p>
    <p class="hint">If WhatsApp sends it as a picture instead of a sticker, import this file into a sticker-pack app (such as Sticker Maker) and add the pack to WhatsApp.</p>
  </div>
  <div id="msg" role="status"></div>
</main>

<script type="module">
import { FFmpeg } from "/vendor/ffmpeg/index.js";

const $ = (id) => document.getElementById(id);
const say = (t, err) => { $("msg").textContent = t; $("msg").className = err ? "err" : ""; };
let blob = null, ffmpeg = null;

async function getFFmpeg() {
  if (ffmpeg) return ffmpeg;
  const f = new FFmpeg();
  f.on("progress", ({ progress }) => {
    if (progress > 0 && progress <= 1) say(`Converting… ${Math.round(progress * 100)}%`);
  });
  say("Loading the converter (first time only, about 30 MB)…");
  await f.load({ coreURL: "/vendor/core/ffmpeg-core.js", wasmURL: "/vendor/core/ffmpeg-core.wasm" });
  return (ffmpeg = f);
}

// Try progressively smaller settings until the file is under WhatsApp's 500 KB limit.
async function toSticker(mp4Bytes) {
  const f = await getFFmpeg();
  await f.writeFile("in.mp4", mp4Bytes);
  for (const [fps, q] of [[15, 60], [12, 45], [10, 35], [8, 25]]) {
    say("Converting…");
    const code = await f.exec([
      "-y", "-i", "in.mp4", "-t", "10", "-an",
      "-vf", `fps=${fps},format=rgba,scale=512:512:force_original_aspect_ratio=decrease,pad=512:512:(ow-iw)/2:(oh-ih)/2:color=black@0`,
      "-c:v", "libwebp", "-lossless", "0", "-q:v", String(q),
      "-compression_level", "4", "-loop", "0", "out.webp",
    ]);
    if (code !== 0) throw new Error("Conversion failed.");
    const data = await f.readFile("out.webp");
    if (data.length <= 500 * 1024) return new Blob([data], { type: "image/webp" });
  }
  throw new Error("This GIF is too long or detailed to fit WhatsApp's 500 KB sticker limit.");
}

async function load() {
  const link = $("link").value.trim();
  if (!link) return say("Paste an X post link first.", true);
  $("go").disabled = true; $("result").style.display = "none"; say("Fetching the GIF…");
  try {
    const r = await fetch("/api/resolve?link=" + encodeURIComponent(link));
    const info = await r.json();
    if (!r.ok) throw new Error(info.error);
    const v = await fetch("/api/video?src=" + encodeURIComponent(info.url));
    if (!v.ok) throw new Error("Couldn't download the GIF.");
    blob = await toSticker(new Uint8Array(await v.arrayBuffer()));
    $("pic").src = URL.createObjectURL(blob);
    $("size").textContent = Math.round(blob.size / 1024) + " KB, 512×512, animated";
    $("result").style.display = "block";
    say("");
  } catch (e) { say(e.message || "Something went wrong.", true); }
  $("go").disabled = false;
}

async function share() {
  const f = new File([blob], "sticker.webp", { type: "image/webp" });
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f] }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  say("Sharing isn't supported here. Download the file and import it into a sticker app.", true);
}

function download() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "sticker.webp"; a.click();
}

$("go").onclick = load;
$("link").addEventListener("keydown", (e) => e.key === "Enter" && load());
$("share").onclick = share;
$("dl").onclick = download;
</script>
</body>
</html>
